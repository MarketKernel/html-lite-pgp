name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Unit tests, build, browser tests
    runs-on: ubuntu-latest
    steps:
      # Actions pinned by commit, not by tag: a tag can be moved to other code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Nothing to install
        run: |
          test ! -e package-lock.json
          node -e "const p=require('./package.json'); if (p.dependencies || p.devDependencies) process.exit(1)"
          gpg --version | head -1
      - run: node --run check
        env:
          CHROME: /usr/bin/google-chrome
      - name: The built page again — nothing from outside, no WebCrypto
        run: |
          node --disable-warning=ExperimentalWarning --input-type=module -e "
            import { readFileSync } from 'node:fs';
            import { assertSelfContained } from './build.mjs';
            const html = readFileSync('build/html-simple-pgp.html', 'utf8');
            assertSelfContained(html);
            if (html.includes('crypto.subtle')) throw new Error('WebCrypto in the page');
          "
